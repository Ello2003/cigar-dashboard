<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cigar Dashboard</title>
<style>
  :root{
    --ink:#1c2530; --ink-soft:#37455a; --paper:#eae4d3; --paper-raised:#f4efe2; --paper-edge:#d5cbac;
    --line:#c7bb98; --brass:#b8874f; --green:#35695c; --blue:#35597a; --red:#a63a2e; --plum:#6a4a6e;
    --slate:#5b6672; --ochre:#8a7a3a;
    --font-display: Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Noto Serif',serif;
    --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono: ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 22px 60px;}

  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
    border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:20px;
  }
  .wordmark{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:0.5px;}
  .wordmark small{
    display:block;font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:3px;
    color:var(--ink-soft);text-transform:uppercase;margin-top:4px;
  }
  .data-actions{display:flex;gap:8px;}

  .kpi-board{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
    background:var(--ink);border:1px solid var(--ink);margin-bottom:22px;border-radius:6px;overflow:hidden;
  }
  .kpi-cell{background:var(--ink);color:var(--paper-raised);padding:14px 16px;}
  .kpi-cell .label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65;}
  .kpi-cell .value{font-family:var(--font-mono);font-size:20px;font-weight:600;margin-top:4px;}

  .tab-bar{display:flex;gap:0;margin-bottom:18px;border-bottom:2px solid var(--paper-edge);flex-wrap:wrap;}
  .tab-btn{
    border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;
    padding:9px 4px;margin-right:22px;color:var(--ink-soft);font-family:var(--font-mono);
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
  .tab-btn:hover{color:var(--ink);}

  button{
    font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;border-radius:5px;
    padding:9px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .btn-primary{background:var(--ink);color:var(--paper-raised);}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-ghost:hover{background:var(--paper-raised);}
  .btn-danger{color:var(--red);border-color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  input[type=text],input[type=number],select{
    font-family:var(--font-body);font-size:13px;padding:8px 10px;border:1px solid var(--paper-edge);
    border-radius:5px;background:var(--paper-raised);color:var(--ink);
  }
  input:focus,select:focus{outline:1px solid var(--ink);}
  .filter-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-bar input[type=text]{flex:1;min-width:180px;}

  .card{background:var(--paper-raised);border:1px solid var(--paper-edge);border-radius:8px;padding:20px;}
  .section-title{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 14px;color:var(--ink);}
  .chart-title{
    font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 14px 0;font-weight:600;
  }
  .empty{text-align:center;padding:52px;color:var(--ink-soft);font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
    text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);color:var(--ink-soft);
  }
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.num{font-family:var(--font-mono);text-align:right;}
  .center{text-align:center;}
  tr:hover td{background:var(--paper);}

  .status-chip{
    font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;font-weight:600;border:1px solid currentColor;display:inline-block;
  }
  .tag{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);
    margin:2px 4px 0 0;display:inline-block;
  }

  .recent-item{display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0;}
  .recent-item:first-child{border-top:none;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .mono{font-family:var(--font-mono);}

  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:18px;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center;font-family:var(--font-mono);font-size:11px;}
  .legend-item{display:flex;align-items:center;gap:6px;color:var(--ink);}
  .swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

  .passes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .pass{
    background:var(--paper-raised);border:1px solid var(--paper-edge);border-radius:10px;
    position:relative;overflow:hidden;transition:box-shadow .15s ease;
  }
  .pass.comparing{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .pass-top{padding:16px 16px 4px;}
  .pass-eyebrow{
    font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);
    display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .eyebrow-country{display:inline-flex;align-items:center;gap:5px;}
  .flag-icon{flex-shrink:0;border:1px solid var(--paper-edge);border-radius:2px;display:block;}
  .pass-name{font-family:var(--font-display);font-weight:700;font-size:20px;margin:6px 0 2px;}
  .pass-line-name{font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--ink-soft);margin:0 0 8px;}
  .pass-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0 4px;}
  .spec-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);display:block;}
  .spec-value{font-family:var(--font-display);font-size:14.5px;font-weight:700;color:var(--ink);}
  .smoke-block{margin:8px 0 4px;}
  .smoke-row{display:flex;align-items:center;gap:9px;margin-top:4px;}
  .smoke-bar{flex:1;height:6px;background:var(--paper-edge);border-radius:3px;overflow:hidden;}
  .smoke-fill{height:100%;background:var(--brass);border-radius:3px;}
  .smoke-value{font-family:var(--font-mono);font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink);}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px;}
  .price-value{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--ink);}
  .pass-flavours{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin:6px 0 2px;letter-spacing:.2px;}
  .perforation{border-top:2px dashed var(--paper-edge);position:relative;margin-top:10px;}
  .perforation::before,.perforation::after{
    content:'';position:absolute;top:-8px;width:16px;height:16px;background:var(--paper);border-radius:50%;
  }
  .perforation::before{left:-8px;} .perforation::after{right:-8px;}
  .cigar-band{margin:12px 16px 0;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass);padding:6px 10px;text-align:center;}
  .band-text{font-family:var(--font-display);font-size:11px;letter-spacing:2.5px;color:#f4efe2;font-weight:700;}
  .pass-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 2px;}
  .source-link{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-decoration:underline;}
  .source-link:hover{color:var(--ink);}
  .pass-actions{display:flex;gap:6px;padding:12px 16px 16px;flex-wrap:wrap;}
  .pass-actions button{flex:1;min-width:80px;}

  ::placeholder{color:#a89a78;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;font-family:var(--font-mono);letter-spacing:.2px;}

  .field-toggles{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--paper-edge);}
  .field-toggle{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;user-select:none;}
  .field-toggle input{margin:0;accent-color:var(--ink);cursor:pointer;}
  .field-toggle.off{opacity:.45;}
  .gh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .version-badge{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);align-self:center;margin-right:2px;}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
(function(){
"use strict";

/* ---------------- DATA (UK retail pricing, GBP) ---------------- */
var SEED_CIGARS = [

  {id:'macanudo-hyde-park',brand:'Macanudo',name:'Café',vitola:'Hyde Park',size:'4.9x49',smokeTime:45,retailPrice:11.00,strength:'Light',flavors:['cream','cedar','nutty'],pairings:['Coffee','Port','Light Ale'],country:'Dominican Republic',rating:7.9},

  {id:'hoyo-de-monterrey',brand:'Hoyo de Monterrey',name:'Línea Clásica',vitola:'Epicure No. 2',size:'4.9x50',smokeTime:50,retailPrice:13.50,strength:'Medium',flavors:['cedar','nutty','earth'],pairings:['Sherry','Rum','Coffee'],country:'Cuba',rating:8.3},
  {id:'rocky-patel-decade',brand:'Rocky Patel',name:'Decade',vitola:'Robusto',size:'5.5x50',smokeTime:60,retailPrice:17.00,strength:'Medium-Full',flavors:['spice','cedar','cocoa'],pairings:['Bourbon','Whisky','Coffee'],country:'Honduras',rating:8.5},
  {id:'don-pepin-garcia',brand:'Don Pepín García',name:'Blue Label',vitola:'Robusto',size:'5x50',smokeTime:55,retailPrice:15.00,strength:'Full',flavors:['pepper','earth','leather'],pairings:['Rum','Whisky','Dark Ale'],country:'Nicaragua',rating:8.7},
  {id:'perdomo-10th',brand:'Perdomo',name:'10th Anniversary',vitola:'Robusto',size:'5x54',smokeTime:65,retailPrice:12.50,strength:'Medium',flavors:['cocoa','cedar','nutty'],pairings:['Coffee','Bourbon','Brandy'],country:'Nicaragua',rating:8.2},
  {id:'crowned-heads-jericho',brand:'Crowned Heads',name:'Jericho Hill',vitola:'Robusto',size:'5x50',smokeTime:55,retailPrice:16.50,strength:'Medium-Full',flavors:['spice','cedar','cocoa'],pairings:['Rye Whisky','Coffee','Port'],country:'Nicaragua',rating:8.6}
];
var STRENGTHS = ['Light','Medium-Light','Medium','Medium-Full','Full'];
var VITOLA_SHAPES = ['Robusto','Toro','Churchill','Corona','Petit Corona','Torpedo','Belicoso','Pyramid','Perfecto','Lancero','Gordo','Double Corona','Panetela','Lonsdale','Presidente','Half Corona','Other/Proprietary'];
var APP_VERSION = 'v8';
var PALETTE = ['#b8874f','#35695c','#35597a','#a63a2e','#6a4a6e','#5b6672','#8a7a3a','#1c2530'];

/* ---------------- STATE ---------------- */
var state = {
  humidor: [], smokeHistory: [], customLibrary: [], wishlist: [], hiddenSeedIds: [],
  activeTab: 'dashboard',
  searchBrand: '', filterStrength: 'All',
  rSearch: '', rCountry: 'All', rStrength: 'All', rMaxPrice: '', rSort: 'rating-desc',
  compareList: [],
  cardFields: { country:true, rating:true, specs:true, smoke:true, price:true, flavours:true, band:true, footer:true },
  githubConfig: null,
  showGithubPanel: false,
  syncStatus: ''
};

function loadState(){
  try{
    var h = localStorage.getItem('humidor-inventory-uk');
    var s = localStorage.getItem('smoke-history-uk');
    var c = localStorage.getItem('custom-library-uk');
    var w = localStorage.getItem('wishlist-uk');
    var hd = localStorage.getItem('hidden-seed-ids-uk');
    var cf = localStorage.getItem('card-fields-uk');
    var gc = localStorage.getItem('github-sync-config-uk');
    if(h) state.humidor = JSON.parse(h);
    if(s) state.smokeHistory = JSON.parse(s);
    if(c) state.customLibrary = JSON.parse(c);
    if(w) state.wishlist = JSON.parse(w);
    if(hd) state.hiddenSeedIds = JSON.parse(hd);
    if(cf) state.cardFields = Object.assign({}, state.cardFields, JSON.parse(cf));
    if(gc) state.githubConfig = JSON.parse(gc);
  }catch(e){ console.warn('Could not load saved data', e); }
}
function persist(){
  localStorage.setItem('humidor-inventory-uk', JSON.stringify(state.humidor));
  localStorage.setItem('smoke-history-uk', JSON.stringify(state.smokeHistory));
  localStorage.setItem('custom-library-uk', JSON.stringify(state.customLibrary));
  localStorage.setItem('wishlist-uk', JSON.stringify(state.wishlist));
  localStorage.setItem('hidden-seed-ids-uk', JSON.stringify(state.hiddenSeedIds));
  localStorage.setItem('card-fields-uk', JSON.stringify(state.cardFields));
  scheduleAutoSync();
}
function library(){
  return SEED_CIGARS.filter(function(c){ return state.hiddenSeedIds.indexOf(c.id)===-1; }).concat(state.customLibrary);
}
function findCigar(id){ return library().filter(function(c){return c.id===id;})[0]; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(n){ n=Math.round(n*100)/100; return '£'+n.toFixed(2); }
function ukDateToDate(str){
  if(!str) return null;
  var p = str.split('/');
  if(p.length!==3) return null;
  var d = new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(d.getTime()) ? null : d;
}
function ageDaysOf(entry){
  var d = entry.dateAddedISO ? new Date(entry.dateAddedISO) : ukDateToDate(entry.dateAdded);
  if(!d || isNaN(d.getTime())) return null;
  return Math.max(0, Math.floor((Date.now()-d.getTime())/86400000));
}
function ageChipHTML(days){
  if(days==null) return '<span class="muted mono">—</span>';
  var color='var(--blue)', label='Fresh';
  if(days>=90){ color='var(--green)'; label='Well Rested'; }
  else if(days>=30){ color='var(--ochre)'; label='Resting'; }
  return '<span class="status-chip" style="color:'+color+';">'+days+'d · '+label+'</span>';
}

/* ---------------- FLAGS ---------------- */

  'Honduras':'<svg class="flag-icon" width="18" height="12" viewBox="0 0 18 12"><rect width="18" height="4" fill="#0073cf"/><rect y="4" width="18" height="4" fill="#fff"/><rect y="8" width="18" height="4" fill="#0073cf"/><circle cx="7" cy="6" r="0.6" fill="#0073cf"/><circle cx="9" cy="6" r="0.6" fill="#0073cf"/><circle cx="11" cy="6" r="0.6" fill="#0073cf"/></svg>'

var FLAG_FALLBACK = '<svg class="flag-icon" width="18" height="12" viewBox="0 0 18 12"><rect width="18" height="12" fill="none" stroke="#9c8b6f" stroke-width="1"/><line x1="0" y1="0" x2="18" y2="12" stroke="#9c8b6f" stroke-width="1"/></svg>';
function flagSVG(country){ return FLAGS[country] || FLAG_FALLBACK; }

/* ---------------- SMOKE TIME + BAND STYLING ---------------- */
function smokeBlockHTML(minutes){
  var pct = Math.max(6, Math.min(100, Math.round((minutes/120)*100)));
  return '<div class="smoke-block"><span class="spec-label">Smoke Time</span>'+
    '<div class="smoke-row"><div class="smoke-bar"><div class="smoke-fill" style="width:'+pct+'%;"></div></div>'+
    '<span class="smoke-value">'+minutes+' min</span></div></div>';
}
function bandColour(strength){
  var map = {'Light':'#cbb98a','Medium-Light':'#b8874f','Medium':'#8a5a2e','Medium-Full':'#6a4a35','Full':'#3f2c22'};
  return map[strength] || '#8a5a2e';
}

/* ---------------- ACTIONS ---------------- */
function addToHumidor(cigarId, cost, cigarObj){
  var cigar = cigarObj || findCigar(cigarId);
  if(!cigar) return;
  var existing = state.humidor.filter(function(h){return h.id===cigarId;})[0];
  if(existing){
    existing.quantity += 1;
    if(cost) existing.actualCost = cost;
  } else {
    var entry = {};
    for(var k in cigar) entry[k]=cigar[k];
    entry.quantity = 1;
    entry.actualCost = cost || cigar.retailPrice;
    var now = new Date();
    entry.dateAdded = now.toLocaleDateString('en-GB');
    entry.dateAddedISO = now.toISOString();
    entry.humidorId = cigarId+'-'+genId();
    state.humidor.push(entry);
  }
  persist(); render();
}

/* ---------------- GITHUB SYNC ---------------- */
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1){
    return String.fromCharCode('0x'+p1);
  }));
}
function saveGithubConfig(){
  var cfg = {
    token: document.getElementById('gh-token').value.trim(),
    owner: document.getElementById('gh-owner').value.trim(),
    repo: document.getElementById('gh-repo').value.trim(),
    path: document.getElementById('gh-path').value.trim() || 'humidor-data.json',
    branch: document.getElementById('gh-branch').value.trim() || 'main',
    autoSync: document.getElementById('gh-autosync').checked
  };
  if(!cfg.token || !cfg.owner || !cfg.repo){ alert('Token, Owner, and Repo are required.'); return; }
  state.githubConfig = cfg;
  localStorage.setItem('github-sync-config-uk', JSON.stringify(cfg));
  state.syncStatus = 'Settings saved.';
  render();
}
var syncDebounceTimer = null;
function scheduleAutoSync(){
  if(!state.githubConfig || !state.githubConfig.autoSync) return;
  if(syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(function(){ githubSync(false); }, 4000);
}
function githubSync(manual){
  var cfg = state.githubConfig;
  if(!cfg || !cfg.token || !cfg.owner || !cfg.repo || !cfg.path){
    if(manual) alert('Please fill in Token, Owner, Repo, and Path, then Save Settings first.');
    return;
  }
  state.syncStatus = 'Syncing…'; render();
  var base = 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/');
  var payload = {
    humidor: state.humidor, smokeHistory: state.smokeHistory, customLibrary: state.customLibrary,
    wishlist: state.wishlist, hiddenSeedIds: state.hiddenSeedIds, syncedAt: new Date().toISOString()
  };
  var contentB64;
  try{ contentB64 = b64EncodeUnicode(JSON.stringify(payload, null, 2)); }
  catch(e){ state.syncStatus = 'Sync failed: could not encode data.'; render(); return; }

  function fetchSha(){
    return fetch(base+'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(), {
      cache: 'no-store',
      headers: { 'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github+json' }
    }).then(function(getResp){
      if(getResp.status===200) return getResp.json().then(function(d){ return d.sha; });
      if(getResp.status===404) return null;
      throw new Error('GET failed ('+getResp.status+')');
    });
  }
  function putFile(sha){
    var body = { message:'Update humidor data — '+new Date().toISOString(), content: contentB64, branch: cfg.branch||'main' };
    if(sha) body.sha = sha;
    return fetch(base, {
      method:'PUT',
      cache: 'no-store',
      headers: { 'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
  }
  function attempt(retriesLeft){
    return fetchSha().then(putFile).then(function(putResp){
      if(putResp.status===409 && retriesLeft>0){
        return attempt(retriesLeft-1);
      }
      if(!putResp.ok){
        return putResp.text().then(function(t){ throw new Error('PUT failed ('+putResp.status+') '+t.slice(0,140)); });
      }
      state.syncStatus = 'Synced '+new Date().toLocaleTimeString('en-GB');
      render();
    });
  }
  attempt(1).catch(function(err){
    state.syncStatus = 'Sync failed: '+err.message;
    render();
  });
}

function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(evt){
    try{
      var data = JSON.parse(evt.target.result);
      state.humidor = data.humidor || [];
      state.smokeHistory = data.smokeHistory || [];
      state.customLibrary = data.customLibrary || [];
      state.wishlist = data.wishlist || [];
      state.hiddenSeedIds = data.hiddenSeedIds || [];
      persist();
      alert('Backup restored successfully.');
      render();
    }catch(err){
      alert('That file could not be read. Please choose a valid backup .json file.');
    }
  };
  reader.readAsText(file);
}
function normaliseCigarRecord(raw){
  var flavors = Array.isArray(raw.flavors) ? raw.flavors : (raw.flavors? String(raw.flavors).split(',').map(function(s){return s.trim();}).filter(Boolean) : ['—']);
  var pairings = Array.isArray(raw.pairings) ? raw.pairings : (raw.pairings? String(raw.pairings).split(',').map(function(s){return s.trim();}).filter(Boolean) : ['—']);
  return {
    id: raw.id || ('checkout-'+genId()),
    brand: raw.brand || 'Unknown',
    name: raw.name || '',
    vitola: raw.vitola || 'Unknown',
    size: raw.size || '—',
    smokeTime: parseInt(raw.smokeTime,10) || 60,
    retailPrice: parseFloat(raw.retailPrice) || 0,
    strength: STRENGTHS.indexOf(raw.strength)>=0 ? raw.strength : 'Medium',
    flavors: flavors.length?flavors:['—'],
    pairings: pairings.length?pairings:['—'],
    country: raw.country || 'Unknown',
    rating: parseFloat(raw.rating) || 8.0,
    website: raw.website || ''
  };
}
function importCigarsFromFile(file){
  var reader = new FileReader();
  reader.onload = function(evt){
    try{
      var data = JSON.parse(evt.target.result);
      var list = Array.isArray(data) ? data : (Array.isArray(data.cigars) ? data.cigars : [data]);
      if(!list.length){ alert('No cigar entries found in that file.'); return; }
      var lib = library();
      var added=0, skipped=0;
      list.forEach(function(raw){
        var cigar = normaliseCigarRecord(raw);
        var dupe = lib.concat(state.customLibrary).some(function(c){
          return c.brand.toLowerCase()===cigar.brand.toLowerCase() &&
            (c.name||'').toLowerCase()===(cigar.name||'').toLowerCase() &&
            c.vitola.toLowerCase()===cigar.vitola.toLowerCase();
        });
        if(dupe){ skipped++; return; }
        state.customLibrary.push(cigar);
        added++;
      });
      persist();
      alert('Imported '+added+' cigar'+(added===1?'':'s')+' into your Research library.'+(skipped?' ('+skipped+' skipped as likely duplicates.)':''));
      render();
    }catch(err){
      alert('That file could not be read. Please choose a valid cigar-import .json file.');
    }
  };
  reader.readAsText(file);
}

/* ---------------- CHART HELPERS (pure SVG/CSS, no deps) ---------------- */
function pieChartHTML(labels, data, size){
  size = size||160;
  var total=0; for(var i=0;i<data.length;i++) total+=data[i];
  if(total<=0) return '<p class="muted center">No data yet</p>';
  var stops=[]; var acc=0;
  for(var i=0;i<data.length;i++){
    var pct = data[i]/total*100;
    stops.push(PALETTE[i%PALETTE.length]+' '+acc.toFixed(2)+'% '+(acc+pct).toFixed(2)+'%');
    acc += pct;
  }
  var gradient = 'conic-gradient(' + stops.join(',') + ')';
  var legend = labels.map(function(l,i){
    return '<div class="legend-item"><span class="swatch" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'+esc(l)+' ('+data[i]+')</div>';
  }).join('');
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+gradient+';margin:0 auto;border:1px solid var(--paper-edge);"></div>'+
         '<div class="legend">'+legend+'</div>';
}
function barChartHTML(labels, data){
  var max = Math.max.apply(null, data.concat([1]));
  var rows = labels.map(function(l,i){
    var pct = (data[i]/max*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:10px;margin:7px 0;">'+
      '<div class="mono" style="width:140px;font-size:11px;color:var(--ink-soft);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(l)+'</div>'+
      '<div style="flex:1;background:var(--paper);border-radius:3px;overflow:hidden;height:16px;">'+
        '<div style="width:'+pct+'%;background:'+PALETTE[i%PALETTE.length]+';height:100%;"></div>'+
      '</div>'+
      '<div class="mono" style="width:28px;font-size:11px;font-weight:700;color:var(--ink);">'+data[i]+'</div>'+
    '</div>';
  }).join('');
  return '<div>'+rows+'</div>';
}
function lineChartHTML(labels, data){
  if(data.length===0) return '<p class="muted center">No data yet</p>';
  var w=520,h=210,padL=54,padR=16,padT=16,padB=32;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  var nums = data.map(Number);
  var max = Math.max.apply(null, nums.concat([1]));
  var points = nums.map(function(v,i){
    var x = nums.length===1 ? padL+innerW/2 : padL + (i/(nums.length-1))*innerW;
    var y = padT + innerH - (v/(max||1))*innerH;
    return {x:x,y:y,v:v,label:labels[i]};
  });
  var pathD = points.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
  var areaD = pathD + ' L'+points[points.length-1].x.toFixed(1)+','+(padT+innerH)+' L'+points[0].x.toFixed(1)+','+(padT+innerH)+' Z';
  var circles = points.map(function(p){
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#1c2530"><title>'+esc(p.label)+': '+money(p.v)+'</title></circle>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;max-width:'+w+'px;">'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" stroke="#c7bb98"/>'+
    '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" stroke="#c7bb98"/>'+
    '<path d="'+areaD+'" fill="rgba(28,37,48,0.08)" stroke="none"/>'+
    '<path d="'+pathD+'" fill="none" stroke="#1c2530" stroke-width="2"/>'+
    circles+
    '<text x="4" y="'+(padT+4)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a">'+money(max)+'</text>'+
    '<text x="4" y="'+(padT+innerH)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a">£0</text>'+
    '<text x="'+padL+'" y="'+(h-6)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a">'+esc(points[0].label)+'</text>'+
    '<text x="'+(padL+innerW-40)+'" y="'+(h-6)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a">'+esc(points[points.length-1].label)+'</text>'+
  '</svg>';
}
function scatterChartHTML(points){
  if(points.length===0) return '<p class="muted center">No data yet</p>';
  var w=520,h=250,padL=58,padR=16,padT=16,padB=40;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  var xs=points.map(function(p){return p.x;}), ys=points.map(function(p){return p.y;});
  var xMax=Math.max.apply(null,xs)*1.1||1, yMax=Math.max.apply(null,ys)*1.15||1;
  var circles = points.map(function(p){
    var cx = padL + (p.x/xMax)*innerW;
    var cy = padT + innerH - (p.y/yMax)*innerH;
    return '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" fill="#b8874f" fill-opacity="0.85" stroke="#1c2530" stroke-width="1">'+
      '<title>'+esc(p.label)+': '+p.x+'m, £'+p.y+'/min</title></circle>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;max-width:'+w+'px;">'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+innerH)+'" stroke="#c7bb98"/>'+
    '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" stroke="#c7bb98"/>'+
    '<text x="'+(padL+innerW/2-60)+'" y="'+(h-6)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a">SMOKE TIME (MIN)</text>'+
    '<text x="10" y="'+(padT+innerH/2)+'" font-size="10" font-family="ui-monospace,monospace" fill="#37455a" transform="rotate(-90,10,'+(padT+innerH/2)+')">£/MIN</text>'+
    circles+
  '</svg>';
}

/* ---------------- RENDER PIECES ---------------- */
function computeStats(){
  var totalCigars=0, totalValue=0, totalSmokeTime=0, totalWeightedTime=0, totalWeightedCost=0;
  var brands={}; var ages=[];
  state.humidor.forEach(function(h){
    totalCigars+=h.quantity; totalValue+=h.actualCost*h.quantity; totalSmokeTime+=h.smokeTime;
    totalWeightedTime+=h.smokeTime*h.quantity; totalWeightedCost+=h.actualCost*h.quantity;
    brands[h.brand]=true;
    var a = ageDaysOf(h); if(a!=null) ages.push(a);
  });
  return {
    totalCigars: totalCigars, uniqueBrands: Object.keys(brands).length, totalValue: totalValue,
    avgSmokeTime: state.humidor.length? Math.round(totalSmokeTime/state.humidor.length):0,
    costPerMinute: totalWeightedTime>0 ? (totalWeightedCost/totalWeightedTime).toFixed(2) : '0.00',
    totalSmoked: state.smokeHistory.length,
    avgAge: ages.length ? Math.round(ages.reduce(function(a,b){return a+b;},0)/ages.length) : null,
    wishlistCount: state.wishlist.length
  };
}
function kpiBoardHTML(){

    cell('Unique Brands', s.uniqueBrands)+
    cell('Total Value', money(s.totalValue))+
    cell('Avg Smoke Time', s.avgSmokeTime+'m')+
    cell('Cost/Min', '£'+s.costPerMinute)+
    cell('Avg Age', s.avgAge!=null?s.avgAge+'d':'—')+

/* ---------------- RENDER + FOCUS PRESERVATION ---------------- */
function render(){
  var root = document.getElementById('root');
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart, selEnd;
  if(active && typeof active.selectionStart === 'number'){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  root.innerHTML = renderApp();
  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---------------- EVENT DELEGATION ---------------- */
function init(){
  loadState();
  var root = document.getElementById('root');
  render();

  root.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');
    if(action==='set-tab'){ state.activeTab = btn.getAttribute('data-tab'); render(); }
    else if(action==='goto-research'){ state.activeTab='research'; render(); }
    else if(action==='add-humidor'){ addToHumidor(id); }
    else if(action==='toggle-compare'){ toggleCompare(id); }
    else if(action==='clear-compare'){ clearCompare(); }
    else if(action==='smoke'){ markAsSmoked(id); }
    else if(action==='remove'){ removeFromHumidor(id); }
    else if(action==='add-wishlist'){ addToWishlist(id); }
    else if(action==='delete-research'){ deleteFromResearch(id); }
    else if(action==='clear-research'){ clearResearch(); }
    else if(action==='wishlist-to-humidor'){ moveWishlistToHumidor(id); }
    else if(action==='remove-wishlist'){ removeFromWishlist(id); }
    else if(action==='export-data'){ exportData(); }
    else if(action==='trigger-restore'){ document.getElementById('restore-file-input').click(); }
    else if(action==='toggle-github-panel'){ state.showGithubPanel = !state.showGithubPanel; render(); }
    else if(action==='gh-close'){ state.showGithubPanel = false; render(); }
    else if(action==='gh-save'){ saveGithubConfig(); }
    else if(action==='gh-sync-now'){ githubSync(true); }
  });

  root.addEventListener('input', function(e){
    var id = e.target.id;
    if(id==='humidor-search'){ state.searchBrand = e.target.value; render(); }
    else if(id==='r-search'){ state.rSearch = e.target.value; render(); }
    else if(id==='r-maxprice'){ state.rMaxPrice = e.target.value; render(); }
  });

  root.addEventListener('change', function(e){
    var id = e.target.id;
    if(id==='humidor-strength-filter'){ state.filterStrength = e.target.value; render(); }
    else if(id==='r-country'){ state.rCountry = e.target.value; render(); }
    else if(id==='r-strength'){ state.rStrength = e.target.value; render(); }
    else if(id==='r-sort'){ state.rSort = e.target.value; render(); }
    else if(id==='restore-file-input'){
      var file = e.target.files[0];
      if(file) importDataFromFile(file);
    }
    else if(id==='import-cigars-input'){
      var cfile = e.target.files[0];
      if(cfile) importCigarsFromFile(cfile);
    }
    else if(e.target.matches('[data-field]')){
      toggleCardField(e.target.getAttribute('data-field'));
    }
  });

  root.addEventListener('submit', function(e){
    if(e.target.id==='custom-cigar-form'){
      e.preventDefault();
      var fd = new FormData(e.target);
      var form = {};
      fd.forEach(function(v,k){ form[k]=v; });
      addCustomCigar(form);
    }
  });
}

init();
})();
</script>
</body>
</html>
